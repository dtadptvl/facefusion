name: Build & Test iFaceFusion

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build Unsigned IPA & Run Tests
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache SPM Packages
        uses: actions/cache@v4
        with:
          path: .spm
          key: ${{ runner.os }}-spm-${{ hashFiles('project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Select installed Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Apple SDKs
        run: xcodebuild -version && xcodebuild -showsdks

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Run Simulator Unit Tests
        run: |
          SIM_NAME=$(xcrun simctl list devices available | grep -m 1 -E "iPhone (16|15)" | sed -E 's/^[[:space:]]*([^(]+).*/\1/' | xargs)
          if [ -z "$SIM_NAME" ]; then
            SIM_NAME="iPhone 16"
          fi
          echo "Executing unit tests on simulator: $SIM_NAME"
          xcodebuild test \
            -project iFaceFusion.xcodeproj \
            -scheme iFaceFusion \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            -only-testing:iFaceFusionTests/iFaceFusionTests \
            -only-testing:iFaceFusionTests/FaceGeometryTests \
            -only-testing:iFaceFusionTests/ColorizerTests \
            -clonedSourcePackagesDirPath .spm \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Build Unsigned Application (arm64)
        run: |
          xcodebuild build \
            -project iFaceFusion.xcodeproj \
            -scheme iFaceFusion \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -clonedSourcePackagesDirPath .spm \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_SIGNATURE_OVERRIDE="" \
            ARCHS=arm64 \
            BUILD_DIR=build

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Release-iphoneos -name "iFaceFusion.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: iFaceFusion.app not found in build/Release-iphoneos"
            exit 1
          fi
          echo "Found app bundle at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r -y iFaceFusion-unsigned.ipa Payload

      - name: Verify IPA Integrity and Invariants
        run: |
          echo "==> Verifying arm64 architecture..."
          file Payload/iFaceFusion.app/iFaceFusion | grep "arm64" || (echo "Binary is not arm64" && exit 1)

          echo "==> Verifying Info.plist exists..."
          test -f Payload/iFaceFusion.app/Info.plist || (echo "Info.plist is missing" && exit 1)

          echo "==> Verifying no embedded.mobileprovision..."
          if [ -f Payload/iFaceFusion.app/embedded.mobileprovision ]; then
            echo "Error: embedded.mobileprovision found in unsigned build"
            exit 1
          fi

          echo "==> Verifying zero bundled models..."
          MODEL_COUNT=$(find Payload/iFaceFusion.app -name "*.onnx" -o -name "*.dfm" | wc -l | tr -d ' ')
          if [ "$MODEL_COUNT" -ne "0" ]; then
            echo "Error: Found bundled models ($MODEL_COUNT files). Models must not be bundled!"
            exit 1
          fi

          echo "All verification checks passed successfully."

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-iFaceFusion
          path: iFaceFusion-unsigned.ipa
          retention-days: 14

  neural-inference-smoke:
    name: Neural Model Inference Smoke Tests
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install XcodeGen & Python Dependencies
        run: |
          brew install xcodegen
          python -m pip install onnx==1.17.0

      - name: Generate Tiny DFM ONNX Fixture
        run: |
          python3 scripts/generate_dfm_fixture.py

      - name: Cache SPM Packages
        uses: actions/cache@v4
        with:
          path: .spm
          key: ${{ runner.os }}-spm-${{ hashFiles('project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Select installed Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Run Simulator Neural Inference Smoke Tests
        run: |
          SIM_NAME=$(xcrun simctl list devices available | grep -m 1 -E "iPhone (16|15)" | sed -E 's/^[[:space:]]*([^(]+).*/\1/' | xargs)
          if [ -z "$SIM_NAME" ]; then
            SIM_NAME="iPhone 16"
          fi
          echo "Executing neural inference smoke tests on simulator: $SIM_NAME"
          xcodebuild test \
            -project iFaceFusion.xcodeproj \
            -scheme iFaceFusion \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            -only-testing:iFaceFusionTests/ModelInferenceTests \
            -parallel-testing-enabled NO \
            -resultBundlePath NeuralInference.xcresult \
            -clonedSourcePackagesDirPath .spm \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO
